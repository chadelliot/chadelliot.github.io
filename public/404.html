      These Open Graph / Twitter tags exist so that link-preview bots

      Real human visitors never see this at all; the script below sends
      them on to the actual page within milliseconds.
    -->

      property="og:description"
      content="Digital marketing leader focused on marketing operations, AI strategy, growth infrastructure, and ecommerce revenue."

    <script type="text/javascript">
      sessionStorage.redirect = location.href;
