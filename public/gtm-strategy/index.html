<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM Strategy — Chad Parker</title>
<meta name="description" content="How I build a go-to-market strategy: one market, built end to end from market and competitive intelligence, then repeated.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700;1,800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#4a9e7a;--green-pale:#edf6f1;--ink:#111;--body:#444;--muted:#888;--rule:#e8e8e8;--surface:#f7f7f7;--white:#fff;
  --amber:#b45309;--comp:#b45309;--blue:#3b6fb0;--violet:#7a6fb0;--water:#e6eef0;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;background:var(--white);color:var(--ink);}

/* ── site nav (same as the rest of the site) ── */
.site-nav{position:fixed;top:0;left:0;right:0;background:rgba(248,249,250,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:24px 80px;z-index:100;}
.site-logo{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.3px;text-decoration:none;}
.site-logo em{font-style:italic;color:var(--green);}
.nav-links{display:flex;gap:32px;list-style:none;align-items:center;}
.nav-links a{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;color:var(--muted);transition:color .15s ease;}
.nav-links a:hover,.nav-links a.active{color:var(--green);}
.nav-dd{position:relative;}
.nav-dd>a::after{content:'▾';margin-left:6px;font-size:9px;}
.nav-dd-menu{position:absolute;top:100%;left:-16px;padding-top:18px;min-width:250px;list-style:none;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s;}
.nav-dd:hover .nav-dd-menu,.nav-dd:focus-within .nav-dd-menu{opacity:1;visibility:visible;transform:none;}
.nav-dd-menu li{background:#fff;border:1px solid var(--rule);}
.nav-dd-menu li:first-child{border-radius:6px 6px 0 0;}.nav-dd-menu li:last-child{border-radius:0 0 6px 6px;border-top:none;}
.nav-dd-menu a{display:block;padding:12px 16px;letter-spacing:1.2px;}
.nav-dd-menu small{display:block;margin-top:3px;font-size:10px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);}
.nav-dd-menu a.active small{color:var(--green);}

/* ── shell ── */
.progress-bar{position:fixed;top:86px;left:220px;right:0;height:3px;background:var(--rule);z-index:95;}
.progress-fill{height:100%;background:var(--green);transition:width .4s ease;}
.shell{display:flex;height:100vh;padding-top:86px;}
.rail{width:220px;flex-shrink:0;border-right:1px solid var(--rule);padding:28px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.rail-hdr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--rule);margin:12px 0 4px;}
.rail-hdr:first-child{margin-top:0;color:var(--green);border-bottom-color:var(--green);}
.rail-step{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:4px;cursor:pointer;transition:background .15s;border:none;background:none;text-align:left;font-family:inherit;}
.rail-step:hover{background:var(--surface);}
.rail-dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--rule);background:#fff;flex-shrink:0;margin-top:4px;transition:all .2s;}
.rail-step.active .rail-dot{background:var(--green);border-color:var(--green);}
.rail-step.done .rail-dot{background:var(--green);border-color:var(--green);opacity:.45;}
.rail-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);line-height:1.4;}
.rail-step.active .rail-label{color:var(--green);}
.rail-step:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}

.stage-area{flex:1;position:relative;min-width:0;padding:26px 40px 84px;overflow:hidden;}
.gx{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:30px;height:100%;}
.gx-text{overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;}
.gx-text>*{flex-shrink:0;}
.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--green);margin-bottom:12px;}
.maya{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--green);}
.maya i{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center;letter-spacing:0;}
.q{font-size:25px;font-weight:800;letter-spacing:-.6px;line-height:1.15;color:var(--ink);margin-bottom:12px;}
.claim{font-size:14px;font-weight:700;font-style:italic;color:var(--ink);margin-bottom:10px;line-height:1.4;}
.body{font-size:13px;line-height:1.7;color:var(--body);margin-bottom:16px;}
.layers{display:grid;gap:8px;margin-bottom:16px;}
.layer-card{border-left:3px solid var(--green);padding:2px 0 2px 12px;}
.layer-card b{display:block;font-size:12px;font-weight:800;color:var(--ink);}
.layer-card span{font-size:12px;line-height:1.5;color:var(--body);}
.rec{border:1px solid var(--green);background:var(--green-pale);border-radius:5px;padding:12px 14px;margin-top:auto;}
.rec b{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--green);margin-bottom:4px;}
.rec span{font-size:12.5px;line-height:1.5;font-weight:600;color:var(--ink);}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px;font-size:10.5px;color:var(--body);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.legend .mk{color:var(--green);}.legend .cp{color:var(--comp);}.legend .sg{color:var(--ink);}
.side{margin:0 0 14px;}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* text swap */
.gx-text>*{animation:txtIn .5s cubic-bezier(.2,.7,.2,1) both;}
.gx-text>*:nth-child(2){animation-delay:.05s}.gx-text>*:nth-child(3){animation-delay:.1s}.gx-text>*:nth-child(4){animation-delay:.15s}.gx-text>*:nth-child(5){animation-delay:.2s}.gx-text>*:nth-child(6){animation-delay:.25s}.gx-text>*:nth-child(7){animation-delay:.3s}
@keyframes txtIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ── map stage ── */
.gx-map{position:relative;border:1px solid var(--rule);border-radius:10px;background:var(--water);overflow:hidden;min-height:340px;}
#map{position:absolute;inset:0;width:100%;height:100%;}
.county{fill:#dfe7e3;stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke;transition:fill .7s ease,opacity .5s ease;cursor:default;}
.county.hl{stroke:var(--ink);stroke-width:2;}
.county.open{stroke:var(--green);stroke-width:2;stroke-dasharray:5 3;}
.nbr{fill:#f7f8f7;stroke:#d9dfdc;stroke-width:1;vector-effect:non-scaling-stroke;}
#cty{filter:drop-shadow(0 1px 3px rgba(40,70,60,.28));}
.corr{fill:none;stroke:#7b8581;stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round;vector-effect:non-scaling-stroke;}
.reach{fill:rgba(180,83,9,.07);stroke:var(--comp);stroke-width:1.2;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;}
.grp{opacity:0;transition:opacity .6s ease;pointer-events:none;}
.grp.on{opacity:1;pointer-events:auto;}
.ic{--c:var(--green);}
.ic.cp{--c:var(--comp);}.ic.sg{--c:var(--ink);}.ic.bl{--c:var(--blue);}.ic.vi{--c:var(--violet);}
.ic .pop{opacity:0;transform:scale(.3);transition:opacity .4s ease,transform .5s cubic-bezier(.2,1.5,.4,1);transition-delay:calc(var(--i,0) * 90ms + .25s);transform-box:fill-box;transform-origin:center;}
.grp.on .ic .pop{opacity:1;transform:scale(1);}
.ic circle.bg{fill:#fff;stroke:var(--c);stroke-width:2;}
.ic use{color:var(--c);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.lb{font:700 11px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round;}
.lb.sm{font-weight:600;font-size:10px;fill:#555;}
.dot{stroke:#fff;stroke-width:1.2;opacity:0;transition:opacity .4s ease,r .3s ease;cursor:pointer;}
.grp.on .dot{opacity:.95;}
.dot.sel{stroke:var(--ink);stroke-width:2.2;}
.ring{fill:none;stroke:var(--ink);stroke-width:1.6;opacity:0;}
.grp.on .ring{animation:ping 2.2s ease-out infinite;animation-delay:calc(var(--i,0) * .25s + .6s);}
@keyframes ping{0%{opacity:.7;transform:scale(.6);}100%{opacity:0;transform:scale(2.1);}}
.ring{transform-box:fill-box;transform-origin:center;}
.nocorner .corner{display:none;}
.corner{position:absolute;right:10px;top:10px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#7b8581;background:rgba(255,255,255,.85);border:1px solid var(--rule);border-radius:10px;padding:3px 9px;z-index:3;}
.ov{position:absolute;left:12px;top:12px;max-width:290px;background:rgba(255,255,255,.96);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.5;color:var(--body);z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.07);animation:txtIn .5s ease both;}
.ov b{color:var(--ink);}
.ov .big{display:block;font-size:26px;font-weight:800;letter-spacing:-.8px;color:var(--ink);line-height:1.1;margin-bottom:4px;}
.ov .k{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;}
.ov ul{list-style:none;margin-top:6px;display:grid;gap:3px;}
.ov li{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;}
.ov.right{left:auto;right:12px;top:42px;}
.ov.bottom{top:auto;bottom:12px;left:12px;right:12px;max-width:none;}
.bars .row{display:grid;grid-template-columns:64px 1fr 34px;gap:8px;align-items:center;font-size:11px;margin-top:6px;}
.bars .tr{height:7px;background:var(--surface);border-radius:4px;overflow:hidden;}
.bars .tr i{display:block;height:100%;background:var(--green);border-radius:4px;}
.ribbon{display:flex;gap:6px;align-items:stretch;}
.ribbon div{flex:1;border:1px solid var(--rule);border-radius:6px;padding:7px 8px;background:#fff;min-width:0;}
.ribbon span{display:block;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}
.ribbon b{display:block;font-size:15px;letter-spacing:-.4px;margin-top:2px;}
.ribbon .leak{border-color:var(--amber);background:#fffaf3;}.ribbon .leak span,.ribbon .leak b{color:var(--amber);}
.feed{display:grid;gap:7px;margin-top:8px;}
.feed button{display:grid;grid-template-columns:22px 1fr;gap:8px;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:7px 9px;font-family:inherit;font-size:11px;line-height:1.35;color:var(--body);cursor:pointer;}
.feed button:hover,.feed button.on{border-color:var(--ink);}
.feed svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.feed b{color:var(--ink);}.feed em{font-style:normal;color:var(--muted);display:block;font-size:10px;}
.tgl{display:inline-flex;border:1px solid var(--rule);border-radius:16px;overflow:hidden;margin-bottom:8px;}
.tgl button{font:700 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;padding:6px 12px;border:none;background:#fff;color:var(--muted);cursor:pointer;}
.tgl button.on{background:var(--ink);color:#fff;}
table.tb{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;}
table.tb th{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:right;padding:3px 0;}
table.tb th:first-child,table.tb td:first-child{text-align:left;}
table.tb td{padding:4px 0;text-align:right;border-top:1px solid var(--rule);color:var(--ink);}
table.tb td i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.rng{position:relative;height:8px;background:var(--surface);border-radius:4px;min-width:70px;}
.rng i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--green);opacity:.35;}
.rng u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);}

/* grids that replace the map (repeat, build) */
.panel{position:absolute;inset:0;padding:18px;overflow:auto;background:#fff;display:none;}
.panel.on{display:block;animation:txtIn .5s ease both;}
.rp{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;height:100%;align-content:center;align-items:start;}
.rp-card{border:1px solid var(--rule);border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:#fff;opacity:0;animation:txtIn .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * .22s + .2s);}
.rp-card svg{width:100%;height:96px;}
.rp-card svg path{fill:#dfe5e2;stroke:#fff;stroke-width:1;}
.rp-card.me svg path{fill:var(--green);}
.rp-card.next{border:2px solid var(--ink);}.rp-card.next svg path{fill:#9fc9b6;}
.rp-card h4{font-size:13px;font-weight:800;}
.rp-card .sc{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;}
.rp-card .nt{font-size:10.5px;color:var(--muted);line-height:1.4;}
.rp-card .tag{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;padding:2px 8px;border-radius:8px;background:var(--surface);color:var(--muted);}
.rp-card.me .tag{background:var(--green-pale);color:var(--green);}.rp-card.next .tag{background:var(--ink);color:#fff;}
.rp-card .mini{width:100%;display:grid;gap:4px;margin-top:auto;}
.rp-card .mini div{display:grid;grid-template-columns:46px 1fr;gap:6px;align-items:center;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;}
.rp-card .mini i{display:block;height:5px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative;}
.rp-card .mini i::after{content:'';position:absolute;inset:0;width:var(--w);background:#8a928e;border-radius:3px;}
.rp-card.me .mini i::after,.rp-card.next .mini i::after{background:var(--green);}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100%;align-content:start;}
.bd-step{border:1px solid var(--rule);border-radius:8px;padding:16px;opacity:0;animation:txtIn .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * .25s + .15s);}
.bd-step b{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--green);}
.bd-step h4{font-size:19px;font-weight:800;letter-spacing:-.4px;margin:4px 0 6px;}
.bd-step p{font-size:12px;line-height:1.55;color:var(--body);}
.bd-ask{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ink);color:#fff;border-radius:8px;padding:16px 20px;opacity:0;animation:txtIn .6s ease both;animation-delay:1.3s;}
.bd-ask span{font-size:14px;font-weight:600;line-height:1.45;}
.bd-ask a{flex-shrink:0;background:#fff;color:var(--ink);text-decoration:none;font-size:12px;font-weight:700;padding:11px 18px;border-radius:5px;}
.bd-ask a:hover{background:var(--green);color:#fff;}

/* ── controls ── */
.nav-buttons{position:fixed;bottom:0;right:0;width:calc(100% - 220px);background:#fff;border-top:1px solid var(--rule);padding:16px 40px;display:flex;align-items:center;justify-content:space-between;z-index:90;}
.stage-counter{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.btn-group{display:flex;gap:10px;}
.btn{padding:9px 22px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:3px;cursor:pointer;border:1px solid var(--rule);font-family:'Inter',sans-serif;transition:all .15s;}
.btn-back{background:#fff;color:var(--muted);}.btn-back:hover{border-color:var(--ink);color:var(--ink);}
.btn-next{background:var(--green);color:#fff;border-color:var(--green);}.btn-next:hover{background:#3a8a68;border-color:#3a8a68;}
.btn:disabled{opacity:.3;cursor:default;}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

@media (max-width:1100px){.gx{grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:22px;}.q{font-size:23px;}.rp{grid-template-columns:repeat(3,1fr);}}
@media (max-width:767px){
  html,body{overflow:auto;height:auto;}
  .site-nav{padding:16px 24px;}.nav-links{display:none;}
  .progress-bar{top:62px;left:0;}
  .shell{display:block;height:auto;padding-top:62px;}
  .rail{display:none;}
  .stage-area{padding:14px 16px 150px;overflow:visible;}
  .gx{display:flex;flex-direction:column;height:auto;gap:14px;}
  .gx-map{order:-1;height:340px;min-height:0;flex-shrink:0;}
  .gx-text{overflow:visible;}
  .q{font-size:22px;}
  .nav-buttons{width:100%;left:0;padding:10px 16px;flex-direction:column;align-items:stretch;gap:8px;}
  .btn-group{display:grid;grid-template-columns:1fr 1fr;}
  .ov{max-width:62%;padding:9px 10px;font-size:11px;}.ov .big{font-size:20px;}
  .ov.bottom{max-width:none;}
  .ribbon div{padding:5px;}.ribbon b{font-size:12px;}
  .rp{grid-template-columns:1fr 1fr;height:auto;}.bd{grid-template-columns:1fr;}
  .bd-ask{flex-direction:column;align-items:flex-start;}
  .gx-map.haspanel{height:auto;}
  .panel{position:static;}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;animation-delay:0s !important;transition-duration:.01s !important;transition-delay:0s !important;}}
.xlink{display:block;margin:2px 0 16px;font-size:12px;font-weight:600;color:var(--green);text-decoration:none;line-height:1.4;}
.xlink:hover{text-decoration:underline;}
.xlink:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:2px;}
.xlink small{display:block;margin-top:2px;font-size:10px;font-weight:500;color:var(--muted);}
</style>
</head>

  return `<span class="k">Account record · score</span><b>${a.name || 'Target account'}</b>${a.ind ? ' · ' + a.ind : ''}<br><span style="font-size:11px;color:var(--muted)">${a.county} County${own ? ' · ' + own.owner : ''}</span>
  <div class="bars"><div class="row"><span>Fit</span><div class="tr"><i style="width:${a.fit}%"></i></div><b>${a.fit}</b></div><div class="row"><span>Intent</span><div class="tr"><i style="width:${a.intent}%"></i></div><b>${a.intent}</b></div></div>
  <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:baseline"><span class="big" style="margin:0">${a.score}</span><b>Tier ${a.tier}</b></div>
  <div style="font-size:11px;margin-top:4px">${nextAction(a)}</div>`;
};
const pick = i => {
  if (cur !== 3) return;
  D.accounts.forEach(a => a._el.classList.remove('sel')); selected = i; D.accounts[i]._el.classList.add('sel');
  $('#ov').innerHTML = `<div class="ov">${acctCard()}</div>`;
};

/* ── steps ── */
const LEG = {
  mk: ['mk', 'Market intelligence'], cp: ['cp', 'Competitive intelligence'], sg: ['sg', 'Buying signal'],
};
const legend = items => `<div class="legend">${items.map(i => i.sw ? `<span><i class="sw" style="background:${i.sw}"></i>${i.t}</span>` : `<span class="${i.c}"><svg viewBox="0 0 24 24"><use href="#i-${i.i}"/></svg>${i.t}</span>`).join('')}</div>`;
const STEPS = [
  { id: 'strategy', group: 'The case', title: 'The strategy', eyebrow: 'The case · Go-to-market strategy', maya: 'Maya’s plan',
    q: 'Build the go-to-market strategy for one market, then run it again.',
    body: 'Maya Chen is VP of Marketing at Meridian Mechanical, a commercial HVAC and mechanical services contractor. She builds the strategy for one market, Maryland, from three layers of evidence, then ties them into one motion that sales and marketing run together.',
    layers: [['Data', 'Who the buyer is, county by county, and who else is selling here.'], ['Journey', 'How buyers decide in this market, and where they stall.'], ['Experience', 'Every touchpoint and signal, fed back in to sharpen the next move.']],
    rec: 'Start with one market. Prove the playbook, then repeat it.',
    cam: () => [1, cx0, cy0], fill: () => setFill('base'), layers_on: [],
    ov: () => `<div class="ov"><span class="k">The market</span><span class="big">${M.name}</span>${D.counties.length} counties · ${fm(M.total_opp_m)} addressable opportunity · ${M.accounts} target accounts</div>` },
  { id: 'market', group: 'Data', title: 'Market', num: '01', eyebrow: 'Data · 01 Market', maya: 'Maya, asking',
    q: 'Where is the demand, county by county?', claim: 'Size the market where the buyers actually are.',
    body: 'Maya scores each county on addressable opportunity, then reads the market intelligence behind the numbers: the port, the airport, the biotech corridor, the logistics hubs and the plants on the Shore.',
    legend: legend([{ c: 'mk', i: 'pin', t: 'Market intelligence' }, { sw: 'rgb(38,112,80)', t: 'More opportunity' }]),
    rec: 'Rank counties by opportunity and fund the top cluster first.',
    cam: () => [1.15, ...hub('Rockville').map((v, i) => i ? v - 20 : v + 70)], fill: () => setFill('opp', { hl: top4.map(c => c.name) }), layers_on: ['corr', 'poi'],
    ov: () => `<div class="ov"><span class="k">Where the demand is</span><span class="big">${pct(top4Share)}</span>of the ${fm(M.total_opp_m)} opportunity sits in four counties:<ul>${top4.map(c => `<li><span>${c.name}</span><b>${fm(c.opp)}</b></li>`).join('')}</ul></div>` },
  { id: 'competition', group: 'Data', title: 'Competition', num: '02', eyebrow: 'Data · 02 Competition', maya: 'Maya, asking',
    q: 'Who else sells here, and where are they thin?', claim: 'Find the open ground before you pick a fight.',
    body: `Maya maps three competitors’ branches and how far each service area reaches. Counties no branch reaches are open ground. Counties two or more reach are contested, and that is where win rates fall.`,
    legend: legend([{ c: 'cp', i: 'truck', t: 'Competitor branch' }, { sw: '#e1f0e8', t: 'Open ground' }, { sw: 'rgb(150,156,168)', t: 'Contested' }]),
    rec: 'Open with the white space and win the contested counties on speed.',
    cam: () => [1, cx0, cy0], fill: () => setFill('comp', { open: true }), layers_on: ['reach', 'comp'],
    ov: () => `<div class="ov"><span class="k">Competitive intelligence</span><span class="big">${white.length} of ${D.counties.length}</span>counties have no competitor branch within ${M.reach_miles} miles. They hold <b>${pct(whiteShare)}</b> of the opportunity: open ground, with the rest contested.</div>` },
  { id: 'customer', group: 'Data', title: 'Customer', num: '03', eyebrow: 'Data · 03 Customer', maya: 'Maya, asking',
    q: 'Which accounts fit, and which are ready?', claim: 'One record per account, scored on fit and intent.',
    body: `Maya merges each account’s records into one profile and scores it. Fit comes from the firm, intent from its signals. ${tier(1)} accounts reach Tier 1 and get a named seller. The rest are nurtured.`,
    legend: legend([{ sw: '#2f7a5a', t: 'Tier 1' }, { sw: '#8dc4ab', t: 'Tier 2' }, { sw: '#c9d0cd', t: 'Tier 3' }]),
    rec: 'Route Tier 1 to a named seller within 24 hours, and nurture the rest.',
    cam: () => [1, cx0, cy0], fill: () => setFill('base'), layers_on: ['accts', 'names'],
    ov: () => `<div class="ov">${acctCard()}</div>`, after: () => { D.accounts.forEach(a => a._el.classList.remove('sel')); D.accounts[selected]._el.classList.add('sel'); } },
  { id: 'journey', group: 'Journey', title: 'Journey', num: '04', eyebrow: 'Journey · 04 Journey', maya: 'Maya, asking',
    q: 'Where do buyers stall in this market?', claim: 'Fix the stage that loses the most buyers.',
    body: `Maya traces the buyer path from first touch to renewal. Win rates vary by county: the more competitors in reach, the lower it falls. The leak is at the quote.`,
    legend: legend([{ sw: '#f2c79a', t: 'Lowest win rate' }]),
    link: ['/approach/#prospect-funnel', 'See the funnel diagnosis and modeled lift →'],
    rec: 'Design for the stage that loses the most buyers, and give renewal the same care as the first contract.',
    cam: () => [1, cx0, cy0], fill: () => setFill('win'), layers_on: ['reach'],
    ov: () => `<div class="ov"><span class="k">Win rate by market</span><span class="big">${pct(winOpen)} vs ${pct(winHeavy)}</span>in open counties versus counties with two or more competitors in reach.</div>
      <div class="ov bottom"><div class="ribbon"><div><span>Lead → MQL</span><b>31%</b></div><div><span>MQL → SQL</span><b>32%</b></div><div><span>SQL → Opp</span><b>50%</b></div><div class="leak"><span>Quote → Won</span><b>${pct(M.win)}</b></div><div><span>Renewal</span><b>61%</b></div></div></div>` },
  { id: 'touchpoints', group: 'Experience', title: 'Touchpoints', num: '05', eyebrow: 'Experience · 05 Touchpoints', maya: 'Maya, asking',
    q: 'What does each touchpoint say, and where does it run?', claim: 'Say the right thing in the right place.',
    body: 'Maya sets a media zone around each territory hub and gives it its own message. The account scores build the audience lists, so advertising reaches the accounts worth reaching.',
    legend: legend([{ c: 'mk', i: 'mega', t: 'Geo-targeted advertising' }]),
    link: ['/approach/#market-messaging', 'See how the audience becomes a campaign →'],
    rec: 'Personalize the few touchpoints that carry the most pipeline before redesigning the rest.',
    cam: () => [1, cx0, cy0], fill: () => setFill('terrSoft'), layers_on: ['zones'],
    ov: () => `<div class="ov"><span class="k">Audience by zone</span>${D.territories.map(t => `<div style="margin-top:6px"><b>${t.name}</b><br><span style="font-size:11px">${t.msg} · ${reach(t.id)} Tier 1 and 2 accounts</span></div>`).join('')}</div>` },
  { id: 'signals', group: 'Experience', title: 'Signals', num: '06', eyebrow: 'Experience · 06 Signals', maya: 'Maya, asking',
    q: 'What are buyers telling us, and when?', claim: 'Turn every touchpoint into a signal someone acts on.',
    body: 'An account leaves a trail: funding, a new executive, an expansion permit, a competitor evaluation. Maya reads them on one timeline and routes each to the right owner.',
    legend: legend([{ c: 'sg', i: 'bolt', t: 'Buying signal' }, { c: 'cp', i: 'alert', t: 'Risk signal' }]),
    link: ['/approach/#signal-intelligence', 'Explore the signal-triggered marketing plays →'],
    rec: 'Agree the handful of signals that matter, who acts on each, and by when.',
    cam: () => [1, cx0, cy0], fill: () => setFill('terrSoft'), layers_on: ['sig', 'accts'],
    side: () => `<span class="k" style="font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Today’s signals · hover to zoom</span><div class="feed">${sigAccts.map((a, i) => `<button data-i="${i}"><svg viewBox="0 0 24 24"><use href="#i-${SIG[a.sig][0]}"/></svg><span><b>${a.name}</b> · ${SIG[a.sig][1]}<em>${a.city} → ${OWNER_OF(a).owner}: ${SIG[a.sig][2]}</em></span></button>`).join('')}</div>`,
    ov: () => `<div class="ov"><span class="k">This week</span><span class="big">${sigAccts.length}</span>buying and risk signals across ${D.territories.length} territories, each routed to an owner.</div>`,
    after: () => document.querySelectorAll('.feed button').forEach(b => { const a = sigAccts[+b.dataset.i]; b.onmouseenter = () => { b.classList.add('on'); setCam(1.7, a.x, a.y, 600); }; b.onmouseleave = () => { b.classList.remove('on'); setCam(1, cx0, cy0, 600); }; }) },
  { id: 'motion', group: 'Strategy', title: 'Motion', num: '07', eyebrow: 'Strategy · 07 Motion', maya: 'Maya, asking',
    q: 'How do sales and marketing run this together?', claim: 'One plan, one scoreboard, one owner per territory.',
    body: 'The three layers meet here. Maya splits the map into three territories with a named owner each, shared stages and one scoreboard, so handoffs are designed rather than negotiated.',
    legend: legend(D.territories.map(t => ({ sw: t.color, t: t.name }))),
    rec: 'Replace two plans with one: a shared target, shared stages and a named owner for every territory.',
    cam: () => [1, cx0, cy0], fill: () => setFill('terr'), layers_on: ['hubs'],
    side: () => `<span class="k" style="font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Shared scoreboard · win rate vs 38% target</span><table class="tb"><tr><th>Territory</th><th>Accts</th><th>Today</th></tr>${D.territories.map(t => `<tr><td><i style="background:${t.color}"></i>${t.owner} · ${t.name}</td><td>${t.accts}</td><td>${pct(t.win)}</td></tr>`).join('')}</table>`,
    ov: () => `<div class="ov"><span class="k">One plan</span>${M.accounts} target accounts in three territories, one named owner each.</div>` },
  { id: 'fund', group: 'Strategy', title: 'Fund', num: '08', eyebrow: 'Strategy · 08 Fund', maya: 'Maya, asking',
    q: 'Where should the next dollar go?', claim: 'Fund the steepest curve.',
    body: `Every channel flattens, so average return says little about the next dollar. Maya reads each territory’s return curve and moves the ${fm(M.budget / 1000)} quarterly budget toward the steepest one.`,
    legend: legend(D.territories.map(t => ({ sw: t.color, t: t.name }))),
    rec: 'Cap the saturated territory, fund the steepest, and reread the curves every month.',
    cam: () => [1, cx0, cy0], fill: () => setFill('terrSoft'), layers_on: ['fund'],
    side: () => `<div class="tgl" id="tgl"><button data-m="equal">Equal split</button><button data-m="opt" class="on">Follow the curve</button></div><div id="fundTb"></div>`,
    ov: () => `<div class="ov"><span class="k">Bubble size</span>Quarterly budget by territory. ${fm(M.budget / 1000)} in total.</div>`,
    after: () => { const draw = m => { document.querySelectorAll('#tgl button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
      const pe = D.money.pipe_equal, po = D.money.pipe_opt, re = D.money.rev_equal, ro = D.money.rev_opt;
      D.territories.forEach(t => { const s = m === 'opt' ? t.opt : t.equal; bub[t.id].c.style.r = (12 + s * .34) + 'px'; bub[t.id].tx.textContent = '$' + s + 'K'; });
      $('#fundTb').innerHTML = `<table class="tb"><tr><th>Territory</th><th>Budget</th><th>Next $1</th></tr>${D.territories.map(t => `<tr><td><i style="background:${t.color}"></i>${t.name}</td><td>$${m === 'opt' ? t.opt : t.equal}K</td><td>$${(m === 'opt' ? t.marg_opt : t.marg_equal).toFixed(2)}</td></tr>`).join('')}</table>
      <div style="margin-top:8px;font-size:11px">Pipeline <b>$${(m === 'opt' ? po : pe)}K</b> · revenue <b>$${(m === 'opt' ? ro : re)}K</b>${m === 'opt' ? ` <span style="color:var(--green);font-weight:700">+$${po - pe}K pipeline, same budget</span>` : ''}</div>`; };
      draw('equal'); setTimeout(() => cur === 8 && draw('opt'), 1400);
      document.querySelectorAll('#tgl button').forEach(b => b.onclick = () => draw(b.dataset.m)); } },
  { id: 'prove', group: 'Strategy', title: 'Prove', num: '09', eyebrow: 'Strategy · 09 Prove', maya: 'Maya, asking',
    q: 'How do we know it is working?', claim: 'Report one number, with the range behind it.',
    body: 'Platforms each claim the sale, so their totals never reconcile. Maya reconciles revenue to finance and reports each territory as a range, so leadership gets a number it can repeat and an allocation it can defend.',
    legend: legend(D.territories.map(t => ({ sw: t.color, t: t.name }))),
    rec: 'Report revenue reconciled to finance, and let the range guide the next allocation.',
    cam: () => [1, cx0, cy0], fill: () => setFill('terrSoft'), layers_on: ['hubs'],
    side: () => { const mx = Math.max(...D.territories.map(x => x.rev_opt * 1.2));
      return `<table class="tb"><tr><th>Territory</th><th>Range</th><th>Base</th></tr>${D.territories.map(t => { const b = t.rev_opt, l = b * .8, h = b * 1.2;
        return `<tr><td><i style="background:${t.color}"></i>${t.name}</td><td><div class="rng"><i style="left:${l / mx * 100}%;width:${(h - l) / mx * 100}%"></i><u style="left:${b / mx * 100}%"></u></div></td><td>$${b}K</td></tr>`; }).join('')}</table><div style="font-size:10.5px;color:var(--muted);margin-top:6px">A target, not a result. Range is ±20% around the base case.</div>`; },
    ov: () => { const tot = D.money.rev_opt; return `<div class="ov"><span class="k">Quarterly revenue target, reconciled to finance</span><span class="big">$${tot}K</span>range $${Math.round(tot * .8)}K to $${Math.round(tot * 1.2)}K</div>`; } },
  { id: 'repeat', group: 'Strategy', title: 'Repeat', num: '10', eyebrow: 'Strategy · 10 Repeat', maya: 'Maya, asking', panel: 'repeat',
    q: 'Which market is next?', claim: 'The same playbook, scored the same way.',
    body: 'Maya runs the same model on the next markets: opportunity, open ground and signal density. The playbook transfers. Only the data changes, and the ranking says where to go first.',
    rec: 'Start where the playbook transfers cleanly. Virginia shares the Capital region.',
    cam: () => [1, cx0, cy0], fill: () => setFill('base'), layers_on: [] },
  { id: 'build', group: 'Strategy', title: 'How I build it', eyebrow: 'Strategy · How I build it', maya: 'Maya’s method', panel: 'build',
    q: 'Map it, align it, build it, run it.',
    body: 'The same four steps for any market. The map comes first because it shows which of the three layers is holding the strategy back.',
    rec: 'Start with the map. It shows what to build first.',
    cam: () => [1, cx0, cy0], fill: () => setFill('base'), layers_on: [] },
];
const GROUPS = ['The case', 'Data', 'Journey', 'Experience', 'Strategy'];

/* ── panels that replace the map ── */
const PANELS = {
  repeat: () => `<div class="rp">${D.repeat.map((r, i) => `<div class="rp-card ${i === 0 ? 'me' : r.name === 'Virginia' ? 'next' : ''}" style="--i:${i}"><span class="tag">${i === 0 ? 'Proven' : r.name === 'Virginia' ? 'Next' : 'Later'}</span><svg viewBox="0 0 ${r.w} ${r.h}" aria-label="${r.name}"><path d="${r.d}"/></svg><h4>${r.name}</h4><div class="sc">${r.score}</div><div class="nt">${r.note}</div><div class="mini"><div>Opp<i style="--w:${r.parts[0]}%"></i></div><div>Open<i style="--w:${r.parts[1]}%"></i></div><div>Signal<i style="--w:${r.parts[2]}%"></i></div></div></div>`).join('')}</div>`,
  build: () => `<div class="bd">${[['01 · Map', 'Profile the market and the customer, trace the real journey, and audit every touchpoint and signal.'], ['02 · Align', 'Turn what we found into one motion for sales and marketing: shared stages, plays, owners and scoreboard.'], ['03 · Build', 'Put it into the systems: the customer record, the routing, the touchpoints and the reporting.'], ['04 · Run', 'Operate it with you, read the results against finance, and move money and effort to what is working.']].map((s, i) => `<div class="bd-step" style="--i:${i}"><b>${s[0].split(' · ')[0]}</b><h4>${s[0].split(' · ')[1]}</h4><p>${s[1]}</p></div>`).join('')}<div class="bd-ask"><span>Start with the map. It takes one market and shows which layer to build first.</span><a href="/contact">Discuss a market →</a></div></div>`,
};

/* ── rail ── */
const rail = $('#rail');
GROUPS.forEach(g => {
  const h = document.createElement('div'); h.className = 'rail-hdr'; h.textContent = g; rail.appendChild(h);
  STEPS.forEach((s, i) => { if (s.group !== g) return; const b = document.createElement('button'); b.className = 'rail-step'; b.id = 'r' + i; b.innerHTML = `<span class="rail-dot"></span><span class="rail-label">${s.num ? s.num + ' ' : ''}${s.title}</span>`; b.onclick = () => go(i); rail.appendChild(b); });
});

/* ── go ── */
let cur = -1;
function go(n) {
  n = Math.max(0, Math.min(STEPS.length - 1, n)); const s = STEPS[n]; const prev = cur; cur = n;
  STEPS.forEach((_, i) => { const r = $('#r' + i); r.classList.toggle('active', i === n); r.classList.toggle('done', i < n); });
  $('#progress').style.width = ((n + 1) / STEPS.length * 100) + '%';
  $('#counter').textContent = s.num ? `Step ${s.num} of ${STEPS.filter(x => x.num).length}` : s.group === 'The case' ? 'The case' : s.title;
  $('#back').disabled = n === 0; const nx = $('#next'); nx.textContent = n === STEPS.length - 1 ? '↩ Start over' : 'Next →';
  $('#text').innerHTML = `<div class="eyebrow">${s.eyebrow}</div><div class="maya"><i>M</i>${s.maya}</div><h1 class="q">${s.q}</h1>${s.claim ? `<p class="claim">${s.claim}</p>` : ''}<p class="body">${s.body}</p>${s.layers ? `<div class="layers">${s.layers.map(l => `<div class="layer-card"><b>${l[0]}</b><span>${l[1]}</span></div>`).join('')}</div>` : ''}${s.legend || ''}${s.side ? `<div class="side">${s.side()}</div>` : ''}${s.link ? `<a class="xlink" href="${s.link[0]}">${s.link[1]}<small>Opens Growth Engine, a separate illustrative case</small></a>` : ''}<div class="rec"><b>Recommendation</b><span>${s.rec}</span></div>`;
  $('#text').scrollTop = 0;
  if (window.innerWidth < 768) window.scrollTo(0, 0);
  const panel = $('#panel'); panel.classList.toggle('on', !!s.panel); panel.innerHTML = s.panel ? PANELS[s.panel]() : '';
  svg.style.visibility = s.panel ? 'hidden' : 'visible'; $('#mapwrap').classList.toggle('haspanel', !!s.panel); $('#mapwrap').classList.toggle('nocorner', s.id === 'build');
  $('#ov').innerHTML = s.panel ? '' : s.ov();
  s.fill(); showLayers(s.layers_on); const [k, fx, fy] = s.cam(); setCam(k, fx, fy, prev < 0 ? 1 : 1000);
  if (s.after) s.after();
  try { history.replaceState(null, '', n ? '#' + s.id : location.pathname + location.search); } catch (e) {}
}
$('#next').onclick = () => go(cur === STEPS.length - 1 ? 0 : cur + 1);
$('#back').onclick = () => go(cur - 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1); if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1); });
{ const h = STEPS.findIndex(x => x.id === location.hash.slice(1)); go(h > 0 ? h : 0); }
window.addEventListener('hashchange', () => { const h = STEPS.findIndex(x => x.id === location.hash.slice(1)); if (h >= 0 && h !== cur) go(h); });
</script>
