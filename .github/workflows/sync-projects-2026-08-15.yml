name: Sync Aug 15 RevHub target accounts

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/sync-target-accounts-2026-08-15.mjs"
      - "scripts/run-target-account-sync-2026-08-15.mjs"
      - ".github/workflows/sync-projects-2026-08-15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync and verify production /projects data
        env:
          SUPABASE_URL: ${{ vars.VITE_PROPOSAL_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.VITE_PROPOSAL_DB_PUBLIC }}
        run: node scripts/run-target-account-sync-2026-08-15.mjs
