<!--
  RevHub Outreach - "Reauthentication" email template.
  Paste into Supabase Dashboard -> Authentication -> Email Templates -> Reauthentication.
  Uses Supabase's Go-template variable ({{ .Token }}) - do not rename or
  remove it, Supabase substitutes it at send time. No CTA link on this one
  (just a one-time code), so the code itself is styled as the focal point
  instead of a button.
  Same styling as invite.html/recovery.html - keep all four in sync if you tweak one.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F4F0;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#FFFFFF;border:1px solid #EEEDE7;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="height:4px;background-color:#2FA37F;font-size:0;line-height:0;">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding:28px 32px 8px 32px;text-align:center;">
            <img src="https://aboutchad.com/revhub-logo.png" width="130" alt="RevHub" style="display:inline-block;height:auto;max-width:130px;" />
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 8px 32px;">
            <p style="margin:0 0 6px 0;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#2FA37F;">RevHub Outreach</p>
            <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;font-weight:800;color:#1A1A1A;">Your verification code</h1>
            <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#4B4B47;">
              Use the code below to verify your identity. It expires shortly.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 36px 32px;text-align:center;">
            <div style="display:inline-block;background-color:#F5F4F0;border:1px solid #EEEDE7;border-radius:12px;padding:16px 32px;">
              <span style="font-family:'SF Mono',Consolas,Menlo,monospace;font-size:28px;font-weight:800;letter-spacing:0.28em;color:#1F7F63;">{{ .Token }}</span>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 32px 32px;border-top:1px solid #EEEDE7;">
            <p style="margin:20px 0 0 0;font-size:12px;line-height:1.6;color:#8A8A85;">
              If you didn't request this code, you can safely ignore this email.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin:20px 0 0 0;font-size:11px;color:#A6A6A0;">RevHub Outreach &middot; aboutchad.com</p>
    </td>
  </tr>
</table>
